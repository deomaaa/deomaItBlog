# Container deployment of the same app that runs on the VPS with systemd + nginx.
# Handy for a local run:  ADMIN_API_KEY=dev docker compose up --build
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: deomablog:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Data Source=/data/blog.db"
      Admin__ApiKey: "${ADMIN_API_KEY:-}"
      Serilog__MinimumLevel__Default: Information
    volumes:
      - deomablog-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  deomablog-data:
