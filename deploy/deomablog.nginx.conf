# deomaBlog — reverse proxy in front of Kestrel (127.0.0.1:5080).
# Certbot rewrites the TLS parts; this is the shape it starts from.
#
#   sudo ln -s /etc/nginx/sites-available/deomablog /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d blog.example.com --redirect

server {
    listen 80;
    listen [::]:80;
    server_name blog.example.com;

    # Security headers, applied to every response.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Long-lived aggressive caching for fingerprinted static assets.
    location ~* \.(css|js|svg|jpg|jpeg|png|webp|woff2?)$ {
        proxy_pass http://127.0.0.1:5080;
        proxy_set_header Host $host;
        proxy_cache_valid 200 7d;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_buffering on;
    }

    # The app owns compression, but nginx does it better for proxied responses.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/xml
        application/json application/xml
        application/javascript image/svg+xml;
}
